<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="oro" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="310">
      <stop offset="0" stop-color="#f3cd6b"/>
      <stop offset="1" stop-color="#c8902c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#14161c"/>

  <!-- Trompeta -->
  <g transform="translate(0 -22)">
    <!-- tudel y boquilla -->
    <path d="M88 220 Q106 228 120 232 L120 240 Q106 244 88 252 Z" fill="url(#oro)"/>
    <line x1="118" y1="236" x2="334" y2="236" stroke="url(#oro)" stroke-width="16"/>
    <!-- vuelta inferior -->
    <rect x="168" y="236" width="156" height="66" rx="33" fill="none" stroke="url(#oro)" stroke-width="13"/>
    <!-- pabellón -->
    <path d="M330 228 C372 226 400 208 424 172 L424 300 C400 264 372 246 330 244 Z" fill="url(#oro)"/>
    <ellipse cx="424" cy="236" rx="9" ry="64" fill="#f6d985"/>
    <!-- pistones -->
    <g fill="url(#oro)">
      <rect x="210" y="198" width="22" height="104" rx="4"/>
      <rect x="241" y="198" width="22" height="104" rx="4"/>
      <rect x="272" y="198" width="22" height="104" rx="4"/>
      <rect x="206" y="186" width="30" height="12" rx="3"/>
      <rect x="237" y="186" width="30" height="12" rx="3"/>
      <rect x="268" y="186" width="30" height="12" rx="3"/>
      <circle cx="221" cy="174" r="10"/>
      <circle cx="252" cy="174" r="10"/>
      <circle cx="283" cy="174" r="10"/>
    </g>
  </g>

  <!-- Onda del drone -->
  <path d="M150 370 q26.5 -28 53 0 t53 0 t53 0 t53 0" fill="none" stroke="#e0b04a"
        stroke-width="11" stroke-linecap="round" opacity=".6"/>
</svg>
